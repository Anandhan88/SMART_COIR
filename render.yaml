services:
  # Backend Express Server
  - type: web
    name: smart-coir-server
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://anandhans23aid_db_user:4ZBrT4v2G3KCHE1X@cluster0.pd1ro5l.mongodb.net/smart-coir?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: smart-coir-jwt-secret-key-change-in-production
      - key: JWT_REFRESH_SECRET
        value: smart-coir-refresh-secret-key-change-in-production
      - key: CLIENT_URL
        sync: false

  # Frontend Next.js App
  - type: web
    name: smart-coir-client
    env: node
    region: singapore
    plan: free
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run start
    envVars:
      - key: NODE_ENV
        value: production
